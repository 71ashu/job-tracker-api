services:
  - type: web
    name: job-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_OPEN_IN_VIEW
        value: "false"

databases:
  - name: job-tracker-db
    plan: free
    databaseName: jobtracker
